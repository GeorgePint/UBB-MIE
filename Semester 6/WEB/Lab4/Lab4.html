<body>

    <h2>Interchange the pieces to complete the cat!</h2>
    <div id="puzzle-container"></div>
    <div id="message"></div>

    <script>
        const container = document.getElementById('puzzle-container');
        const messageDiv = document.getElementById('message');
        const gridSize = 3;
        const totalPieces = gridSize * gridSize;
        
        let pieces = [];
        let selectedIndex = null;

        for (let i = 0; i < totalPieces; i++) {
            pieces.push(i);
        }

        for (let i = pieces.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [pieces[i], pieces[j]] = [pieces[j], pieces[i]];
        }

        function render() {
            container.innerHTML = ''; // Golim containerul
            
            pieces.forEach((pieceValue, currentIndex) => {
                const pieceDiv = document.createElement('div');
                pieceDiv.classList.add('puzzle-piece');

                // Calculate the correct original X and Y position for the background image
                const row = Math.floor(pieceValue / gridSize);
                const col = pieceValue % gridSize;
                
                // Shift the background image so the cell only shows its specific part of the big picture
                pieceDiv.style.backgroundPosition = `-${col * 100}px -${row * 100}px`;

                if (selectedIndex === currentIndex) {
                    pieceDiv.classList.add('selected');
                }

                // click listener
                pieceDiv.addEventListener('click', () => handlePieceClick(currentIndex));
                container.appendChild(pieceDiv);
            });
        }

        function handlePieceClick(index) {
            if (messageDiv.textContent === 'Well done!') return;

            if (selectedIndex === null) {
                // First click: select the piece
                selectedIndex = index;
                render();
            } else {
                // Second click: Swap the array values
                [pieces[selectedIndex], pieces[index]] = [pieces[index], pieces[selectedIndex]];
                selectedIndex = null; // Clear selection
                render();
                checkWinCondition();
            }
        }

        function checkWinCondition() {
            let isSolved = true;
            for (let i = 0; i < totalPieces; i++) {
                if (pieces[i] !== i) {
                    isSolved = false;
                    break;
                }
            }

            if (isSolved) {
                messageDiv.textContent = 'Well done!';
            }
        }

        render();
    </script>
</body>
</html>
