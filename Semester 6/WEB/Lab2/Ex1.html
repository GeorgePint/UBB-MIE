<!DOCTYPE html>
<html>
<head>
<style>
  body {
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }

  .liquid-container {
    /* The magic happens here: blur + high contrast = liquid */
    filter: blur(10px) contrast(30);
    background: #111; 
    padding: 40px;
  }

  .liquid-text {
    color: white;
    font-size: 8rem;
    font-family: sans-serif;
    font-weight: bold;
    letter-spacing: -2px;
    transition: transform 0.6s ease, letter-spacing 0.6s ease, filter 0.6s ease;
    cursor: pointer;
    display: inline-block;
  }

  /* Interaction: Warp and Ripple */
  .liquid-text:hover {
    transform: scale(1.1) skewX(15deg);
    letter-spacing: 15px;
    filter: blur(2px); /* Softens the edges to let the contrast "melt" it */
  }

  /* Secondary "Ripple" on Click (Active state) */
  .liquid-text:active {
    transform: scale(0.9) rotate(-5deg);
    filter: blur(10px);
  }
</style>
</head>
<body>

  <div class="liquid-container">
    <span class="liquid-text">LIQUID</span>
  </div>

</body>
</html>
